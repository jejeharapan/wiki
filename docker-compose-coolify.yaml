services:
  wiki-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${COOLIFY_CONTAINER_NAME:-corporate-wiki}
    ports:
      - ${APP_PORT:+$APP_PORT:}80
    restart: always
    environment:
      - APP_ENV=${APP_ENV:-production}
      - SITE_NAME=${SITE_NAME:-Corporate Tools Wiki & Guides}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
